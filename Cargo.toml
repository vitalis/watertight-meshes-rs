[package]
name = "watertight-meshes-rs"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bkhubbard@gmail.com>", "Philipp Sieben (PixelArtistry)", "watertight-meshes-rs contributors"]
license = "MIT"
description = "High-performance Rust engine and cross-platform CLI for generating, validating, voxelizing, and repairing 100% watertight 3D AI meshes"
repository = "https://github.com/bhubbard/watertight-meshes-rs"
homepage = "https://github.com/bhubbard/watertight-meshes-rs"
readme = "README.md"
keywords = ["3d", "mesh", "watertight", "comfyui", "voxel"]
categories = ["graphics", "command-line-utilities"]

[lib]
name = "watertight"
path = "src/lib.rs"

[[bin]]
name = "watertight"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
indicatif = "0.17"
colored = "3.0"
ureq = { version = "3.4.2", features = ["json"] }
sha2 = "0.10"
byteorder = "1.5"

[dev-dependencies]
approx = "0.5"
